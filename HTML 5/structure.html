<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        #nav-container{
            background-color : rgb(100, 175, 13);
            color : white;
            height : 50px;
            width : 99%;
            display : flex;
            justify-content : space-around;
            align-items : center;
        }
        #nav_container a{
            padding : 10px;
            text-decoration : none;
            color : white;
        }
        /*hover effect*/
        #nav-container a:hover{
            background-color : white;
            color : black;
            border-radius : 20px;
        }
        .nav-logo{
            font-size : larger;
            font-weight : bold;
            color : white;

        }
        .nav-btn{
            padding : 10px;
            background-color : red;
            color : white;
            border : none;
            border-radius : 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class = "card-container">
        <div class = "card">
            <div class = "card-image">
                

       </div>
    </div>
    <div id ="nav-container">
    <div class = " nav-logo">
        My logo
    </div>
    <div class = "nav-items">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>

    </div>
    <button class="nav-btn">Login</button>
    </div>
</body>
</html>
