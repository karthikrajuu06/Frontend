<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .calculator {
            background-color: #1c1c1e;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.3);
            width: 320px;
        }
        #display {
            width: 100%;
            height: 70px;
            background-color: #1c1c1e;
            border: none;
            color: #ffffff;
            font-size: 2.5rem;
            text-align: right;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            padding: 20px;
            font-size: 1.5rem;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background-color: #3a3a3c;
            color: white;
            transition: background-color 0.1s ease;
        }
        button:active {
            background-color: #5c5c5e;
        }
        button.operator {
            background-color: #ff9f0a;
            color: white;
        }
        button.operator:active {
            background-color: #fcc26c;
        }
        button.function {
            background-color: #a5a5a5;
            color: black;
        }
        button.function:active {
            background-color: #d4d4d4;
        }
        button.zero {
            grid-column: span 2;
            border-radius: 30px;
            text-align: left;
            padding-left: 30px;
        }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" readonly>
    <div class="buttons">
        <button class="function" onclick="clearDisplay()">C</button>
        <button class="function" onclick="deleteLast()">⌫</button>
        <button class="function" onclick="appendValue('%')">%</button>
        <button class="operator" onclick="appendValue('/')">÷</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('*')">×</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('-')">−</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button onclick="appendValue('0')" class="zero">0</button>
        <button onclick="appendValue('.')">.</button>
        <button class="operator" onclick="calculateResult()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');

    function appendValue(value) {
        display.value += value;
    }

    function clearDisplay() {
        display.value = '';
    }

    function deleteLast() {
        display.value = display.value.slice(0, -1);
    }

    function calculateResult() {
        try {
            // Replace visual operators with standard JS math operators if necessary
            let expression = display.value;
            
            // Using Function instead of eval for safer basic evaluation
            if (expression) {
                display.value = new Function(`return ${expression}`)();
            }
        } catch (error) {
            display.value = 'Error';
        }
    }tus 
</script>

</body>
</html>
